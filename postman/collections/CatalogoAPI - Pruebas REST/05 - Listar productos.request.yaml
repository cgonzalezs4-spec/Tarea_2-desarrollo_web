$kind: http-request
url: http://localhost:3000/api/productos
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Consulta pública - HTTP 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"El catálogo devuelve una lista\", function () {\r

      \    const respuesta = pm.response.json();\r

      \r

      \    pm.expect(\r

      \        Array.isArray(respuesta) ||\r

      \        Array.isArray(respuesta.productos)\r

      \    ).to.eql(true);\r

      });"
    language: text/javascript
order: 5000
